<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nexus Orchestrator | Control Plane</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #09090b;
        --panel: rgba(24, 24, 27, 0.85);
        --border: rgba(63, 63, 70, 0.3);
      }
      body {
        background: var(--bg);
        font-family: "Inter", sans-serif;
        color: #fafafa;
        height: 100vh;
        overflow: hidden;
        margin: 0;
      }
      .mono {
        font-family: "JetBrains Mono", monospace;
      }
      .glass {
        background: var(--panel);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border);
      }

      /* The Master Framework */
      .master-layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        grid-template-rows: 70px 1fr;
        gap: 20px;
        height: 100vh;
        padding: 20px;
        box-sizing: border-box;
      }

      /* Forces the three main sections to exist and stay in their lanes */
      .content-stack {
        display: grid;
        grid-template-rows: 110px 280px 1fr;
        gap: 20px;
        height: 100%;
        min-height: 0;
      }

      .core-card {
        background: rgba(9, 9, 11, 0.4);
        border: 1px solid var(--border);
        height: 95px;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
      }
      /* The "Pro" Zoom */
      .core-card:hover {
        transform: scale(1.5) translateY(-10px);
        z-index: 100;
        border-color: #06b6d4;
        background: #18181b;
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8);
      }

      #terminal-output::-webkit-scrollbar {
        width: 4px;
      }
      #terminal-output::-webkit-scrollbar-thumb {
        background: #3f3f46;
        border-radius: 10px;
      }
      canvas {
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <div class="master-layout">
      <header
        class="col-span-2 flex justify-between items-center border-b border-zinc-800 pb-2"
      >
        <h1 class="text-2xl font-black tracking-tighter uppercase text-white">
          NEXUS<span class="text-cyan-500 font-light">_CONTROL</span>
        </h1>
        <button
          onclick="socket.emit('system_reset')"
          class="bg-zinc-900 border border-zinc-800 text-[10px] font-black px-6 py-2 rounded uppercase hover:bg-rose-900/20 transition-all"
        >
          Factory Reset
        </button>
      </header>

      <aside class="flex flex-col gap-4 min-w-0">
        <div class="glass p-5 rounded-2xl border-l-4 border-l-blue-500">
          <p
            class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-3"
          >
            01. Cluster
          </p>
          <button
            onclick="socket.emit('start_docker')"
            class="w-full bg-zinc-100 text-black py-4 rounded-lg font-bold text-[11px] uppercase transition-all hover:bg-white"
          >
            Initialize
          </button>
        </div>

        <div class="glass p-5 rounded-2xl border-l-4 border-l-purple-500">
          <p
            class="text-[10px] font-black text-purple-500 uppercase tracking-widest mb-3"
          >
            02. Ingestion
          </p>
          <button
            onclick="socket.emit('start_producer')"
            class="w-full bg-purple-600 text-white py-4 rounded-lg font-bold text-[11px] uppercase mb-2 shadow-lg hover:bg-purple-500"
          >
            Start Producer
          </button>
          <button
            id="btnPauseProd"
            onclick="socket.emit('toggle_producer_pause')"
            class="w-full bg-zinc-800 text-zinc-500 py-2 rounded text-[9px] font-bold uppercase hidden border border-zinc-700"
          >
            Pause Ingestion
          </button>
        </div>

        <div
          class="glass p-5 rounded-2xl border-l-4 border-l-emerald-500 flex-grow flex flex-col min-h-0"
        >
          <p
            class="text-[10px] font-black text-emerald-500 uppercase tracking-widest mb-3"
          >
            03. Swarm Logic
          </p>
          <button
            onclick="socket.emit('start_swarm_engine')"
            class="w-full bg-emerald-600 text-white py-4 rounded-lg font-bold text-[10px] uppercase mb-6 shadow-lg hover:bg-emerald-500"
          >
            Start Swarm Engine
          </button>
          <div
            class="bg-zinc-950 p-5 rounded-xl text-center mb-6 border border-zinc-800"
          >
            <span
              id="workerCount"
              class="text-4xl font-black text-white tracking-tighter mono"
              >00/00</span
            >
            <span
              class="text-[9px] text-zinc-600 uppercase block mt-1 font-black"
              >Active Threads</span
            >
          </div>
          <div class="grid grid-cols-2 gap-3 mt-auto">
            <button
              onclick="socket.emit('spawn_worker')"
              class="bg-zinc-100 text-black py-4 rounded-xl font-black text-2xl shadow-lg hover:bg-white"
            >
              +
            </button>
            <button
              onclick="socket.emit('kill_worker')"
              class="bg-zinc-800 text-white py-4 rounded-xl font-black text-2xl shadow-lg hover:bg-zinc-700"
            >
              -
            </button>
          </div>
        </div>
      </aside>

      <div class="content-stack">
        <div class="grid grid-cols-3 gap-6">
          <div class="glass p-5 rounded-2xl border-b-2 border-emerald-500/40">
            <p
              class="text-[11px] font-black text-zinc-500 uppercase tracking-widest mb-1"
            >
              Throughput
            </p>
            <p id="valSuccess" class="text-4xl font-black text-white mono">0</p>
          </div>
          <div class="glass p-5 rounded-2xl border-b-2 border-rose-500/40">
            <p
              class="text-[11px] font-black text-zinc-500 uppercase tracking-widest mb-1"
            >
              Queue Depth
            </p>
            <p id="valQueue" class="text-4xl font-black text-white mono">0</p>
          </div>
          <div class="glass p-5 rounded-2xl border-b-2 border-amber-500/40">
            <p
              class="text-[11px] font-black text-zinc-500 uppercase tracking-widest mb-1"
            >
              AI Rescues
            </p>
            <p id="valRetries" class="text-4xl font-black text-white mono">0</p>
          </div>
        </div>

        <div class="grid grid-cols-12 gap-6 h-full min-h-0">
          <div
            class="col-span-8 glass p-5 rounded-2xl flex flex-col"
            style="overflow: visible !important"
          >
            <p
              class="text-[10px] font-black text-cyan-500 mb-4 uppercase tracking-widest"
            >
              Hardware Topology
            </p>
            <div id="core-grid" class="grid grid-cols-6 gap-3 flex-grow"></div>
          </div>
          <div class="col-span-4 flex flex-col gap-4 min-h-0">
            <div
              class="glass p-4 rounded-2xl flex-1 flex flex-col overflow-hidden"
            >
              <span
                class="text-[10px] font-black text-purple-400 uppercase tracking-widest mb-2"
                >Memory</span
              >
              <div class="flex-grow min-h-0">
                <canvas id="memChart"></canvas>
              </div>
            </div>
            <div
              class="glass p-4 rounded-2xl flex-1 flex flex-col overflow-hidden"
            >
              <span
                class="text-[10px] font-black text-teal-400 uppercase tracking-widest mb-2"
                >GPU Load</span
              >
              <div class="flex-grow min-h-0">
                <canvas id="gpuChart"></canvas>
              </div>
            </div>
          </div>
        </div>

        <div
          class="glass rounded-3xl flex flex-col overflow-hidden bg-black/20 min-h-0"
        >
          <div
            class="bg-zinc-900/80 px-6 py-3 border-b border-zinc-800 flex justify-between items-center text-[10px] font-bold text-zinc-500 uppercase tracking-widest"
          >
            <span>Master Console Feed</span>
            <span class="text-cyan-500/50 font-mono">STDOUT :: ACTIVE</span>
          </div>
          <div
            id="terminal-output"
            class="p-6 overflow-y-auto text-[11px] mono leading-relaxed space-y-1.5 flex-grow"
          ></div>
        </div>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
